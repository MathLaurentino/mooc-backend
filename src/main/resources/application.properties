server.port=8080
spring.application.name=mooc
server.servlet.context-path=/mooc

server.base-url=http://localhost:8080

spring.datasource.url=jdbc:postgresql://localhost:5432/mooc
spring.datasource.username=postgres
spring.datasource.password=ifpr
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

jwt.secret=b1uG1czRIWCQsT6qgVZfxj2OgjjzceUiaL9NzNBPlqdMqa4fX9dO0nMY51QsSLVJ
jwt.expiration.hours=12
jwt.issuer=MOOC IFPR

file.storage.base-path=C:/mooc-uploads

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true

crypto.keys.storage-path=C:/mooc-keys