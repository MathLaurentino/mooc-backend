      - url: "{{ _.baseURl }}/auth/login"
        name: Login (TODOS)
        meta:
          id: req_02f70b4f8d33423ba4884c5cefdea672
          created: 1757873476510
          modified: 1763517533924
          isPrivate: false
          description: ""
          sortKey: -1759091090555
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
            	"email": "admin@mooc.ifpr.edu.br",
            	"password": "senha"
            }
        headers:
          - name: Content-Type
            value: application/json
          - name: User-Agent
            value: insomnia/11.6.0
        scripts:
          afterResponse: >-
            // Script para a aba Tests do request de login

            const response = insomnia.response;


            try {
              const responseBody = JSON.parse(response.getBody())
            
              // Verifica se o login foi bem-sucedido (status 200)
              if (response.getStatusCode() === 200) {
            
                let jwtToken = null;
            
                // Tenta encontrar o token nas estruturas mais comuns
                if (insomnia.response.text().access_token) {
                  jwtToken = insomnia.response.text().access_token;
                }
                else if (insomnia.response.text().token) {
                  jwtToken = insomnia.response.text().token;
                }
                else if (insomnia.response.text().data && insomnia.response.text().data.token) {
                  jwtToken = insomnia.response.text().data.token;
                }
                else if (insomnia.response.text().data && insomnia.response.text().data.access_token) {
                  jwtToken = insomnia.response.text().data.access_token;
                }
            
                if (jwtToken) {
                  // Salva no ambiente global
                  insomnia.environment.set('jwt_token', jwtToken);
                  insomnia.environment.set('authorization_header', `Bearer ${jwtToken}`);
            
                  console.log('✅ JWT Token capturado e salvo!');
                  console.log('Token:', jwtToken.substring(0, 30) + '...');
            
                } else {
                  console.log('❌ JWT Token não encontrado no response');
                  console.log('Response completo:', JSON.stringify(insomnia.response.text(), null, 2));
                }
            
              } else {
                console.log('❌ Login falhou, status:', response.getStatusCode());
              }
            
            
            } catch (error) {
              console.log('❌ Erro ao processar response:', error.message);
            }
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
